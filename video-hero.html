<title>OkDébouchage — Vidéo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./css2(1)" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:"Archivo Black",Impact,sans-serif;color:#fafafa}

  /* Slideshow layer (top) */
  .slideshow{position:fixed;inset:0;z-index:2;opacity:1;transition:opacity .6s ease}
  .slideshow.gone{opacity:0;pointer-events:none;transition:opacity 1.2s ease}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
  .slide.on{opacity:1}
  .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 7s linear forwards}
  .slide:nth-child(2) img{animation-direction:reverse}
  .slide:nth-child(3) img{animation-name:kb2}
  @keyframes kb{0%{transform:scale(1.05)}100%{transform:scale(1.16) translate(-1.5%,-1%)}}
  @keyframes kb2{0%{transform:scale(1.05)}100%{transform:scale(1.16) translate(1.5%,-1%)}}

  .vignette{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 55%,rgba(0,0,0,.85) 100%),
    radial-gradient(120% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
    pointer-events:none}

  .caption{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 26px;color:#fafafa;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .caption .tag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#FFB347;opacity:.9}
  .caption .line{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(20px,5.2vw,28px);line-height:1.05;letter-spacing:-0.01em;text-wrap:balance}
  .caption .line em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:#FFB347;letter-spacing:0}

  .topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#fafafa;pointer-events:none;z-index:3}
  .topbar .live{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:6px 10px;border-radius:6px}
  .topbar .ldot{width:6px;height:6px;border-radius:50%;background:#ff3b30;animation:pulse 1.4s infinite}
  .topbar .ok{background:rgba(255,255,255,.92);color:#0a0a0a;padding:6px 10px;border-radius:6px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .progress{position:absolute;left:14px;right:14px;bottom:0;height:3px;display:flex;gap:4px;padding-bottom:14px;pointer-events:none;z-index:3}
  .progress .bar{flex:1;height:3px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden;position:relative}
  .progress .bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0%;background:#fafafa;transition:width .12s linear}
  .progress .bar.done::after{width:100%}
  .progress .bar.active::after{width:var(--p,0%)}

  /* Original video layer (below) */
  .videoframe{position:fixed;inset:0;z-index:1;border:0;width:100%;height:100%;background:#0a0a0a}
</style>
</head>
<body>
  <!-- Original debouchage video, loaded behind the slideshow so it's ready when we fade -->
  <iframe class="videoframe" id="videoframe" src="./video-original.html" title="OkDébouchage — Vidéo" allow="autoplay" loading="eager"></iframe>

  <div class="slideshow" id="slideshow">
    <div class="slide on" data-tag="01 · INTERVENTION"><img src="./camionnette.png" alt="" style=""></div>
    <div class="slide" data-tag="02 · HYDROCURAGE"><img src="./bruxelles-maquette.png" alt="" style=""></div>
    <div class="slide" data-tag="03 · BRUXELLES"><img src="./bruxelles-maquette.png" alt="" style=""></div>
    <div class="vignette"></div>

    <div class="topbar">
      <span class="ok">OK · DÉBOUCHAGE</span>
      <span class="live"><span class="ldot"></span>EN INTERVENTION</span>
    </div>

    <div class="caption">
      <span class="tag" id="tag">01 · INTERVENTION</span>
      <div class="line" id="line">Camion équipé, <em>chez vous</em> en 45 min.</div>
    </div>

    <div class="progress" id="progress">
      <div class="bar active" style=""></div><div class="bar" style=""></div><div class="bar" style=""></div>
    </div>
  </div>

<script>
  const SLIDE_MS = 6667; // 3 × 6.67s ≈ 20s of photos, then fade to the letters video
  const VIDEO_MS = 20000; // ~durée de la vidéo des lettres avant de revenir aux photos
  const slides = document.querySelectorAll('.slide');
  const bars = document.querySelectorAll('#progress .bar');
  const tagEl = document.getElementById('tag');
  const lineEl = document.getElementById('line');
  const shell = document.getElementById('slideshow');
  const videoframe = document.getElementById('videoframe');

  const captions = [
    {tag:'01 · INTERVENTION', html:'Camion équipé, <em>chez vous</em> en 45 min.'},
    {tag:'02 · HYDROCURAGE',  html:'Bouchon évacué. <em>Garanti</em> 6 mois.'},
    {tag:'03 · BRUXELLES',    html:'19 communes. <em>7j/7</em>, sans majoration.'}
  ];

  let idx = 0, t0 = 0, raf = null, done = false;

  function show(i){
    slides.forEach((s,k)=>s.classList.toggle('on', k===i));
    bars.forEach((b,k)=>{
      b.classList.toggle('done', k<i);
      b.classList.toggle('active', k===i);
    });
    tagEl.textContent = captions[i].tag;
    lineEl.innerHTML = captions[i].html;
    const img = slides[i].querySelector('img');
    img.style.animation = 'none';
    img.offsetHeight;
    img.style.animation = '';
  }

  function finish(){
    if(done) return;
    done = true;
    cancelAnimationFrame(raf);
    shell.classList.add('gone');
    // Après ~20s de vidéo des lettres, on relance le slideshow → boucle infinie
    setTimeout(restart, VIDEO_MS);
  }

  function restart(){
    // Relance la vidéo des lettres depuis le début pour que la prochaine fenêtre soit propre
    try { videoframe.src = videoframe.src; } catch(e){}
    done = false;
    idx = 0;
    t0 = 0;
    bars.forEach(b=>{ b.classList.remove('done','active'); b.style.removeProperty('--p'); });
    shell.classList.remove('gone');
    show(0);
    raf = requestAnimationFrame(tick);
  }

  function tick(t){
    if(!t0) t0 = t;
    const elapsed = t - t0;
    const p = Math.min(100, (elapsed/SLIDE_MS)*100);
    bars[idx].style.setProperty('--p', p+'%');
    if(elapsed >= SLIDE_MS){
      if(idx === slides.length - 1){ finish(); return; }
      idx++;
      t0 = t;
      show(idx);
    }
    raf = requestAnimationFrame(tick);
  }

  show(0);
  raf = requestAnimationFrame(tick);
</script>


</body></html>
